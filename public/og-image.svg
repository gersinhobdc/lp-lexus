<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1F40"/>
      <stop offset="100%" stop-color="#13284D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="33%" stop-color="#22C55E"/>
      <stop offset="66%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0C1F40" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0C1F40" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Dot grid -->
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#60A5FA" opacity="0.18"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left green accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>

  <!-- Logo mark — barras coloridas Lexus -->
  <rect x="72" y="72" width="32" height="9"  rx="4.5" fill="#FACC15"/>
  <rect x="68" y="88" width="34" height="10" rx="5"   fill="#22C55E"/>
  <rect x="72" y="104" width="34" height="10" rx="5"  fill="#22C55E"/>
  <rect x="70" y="120" width="32" height="9"  rx="4.5" fill="#EC4899"/>

  <!-- LEXUS wordmark text -->
  <text x="118" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#E8E8ED" letter-spacing="5">LEXUS</text>
  <text x="119" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#A1A1AA" letter-spacing="5">AUTOMAÇÃO INTELIGENTE</text>

  <!-- Divider line under logo -->
  <rect x="68" y="148" width="280" height="1" fill="#22C55E" opacity="0.3"/>

  <!-- Main headline -->
  <text x="68" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#E8E8ED">Viva em uma casa</text>
  <text x="68" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#E8E8ED">que <tspan fill="url(#accent)">pensa por você.</tspan></text>

  <!-- Subtitle -->
  <text x="68" y="418" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#A1A1AA">Automação residencial e corporativa premium em São Paulo</text>

  <!-- Stats chips -->
  <rect x="68"  y="460" width="210" height="64" rx="14" fill="#13284D" stroke="#22C55E" stroke-width="1" stroke-opacity="0.3"/>
  <text x="173" y="488" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#22C55E" text-anchor="middle">2.500+</text>
  <text x="173" y="512" font-family="system-ui, sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">Projetos entregues</text>

  <rect x="296" y="460" width="210" height="64" rx="14" fill="#13284D" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.3"/>
  <text x="401" y="488" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#60A5FA" text-anchor="middle">16+</text>
  <text x="401" y="512" font-family="system-ui, sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">Anos de experiência</text>

  <rect x="524" y="460" width="210" height="64" rx="14" fill="#13284D" stroke="#FACC15" stroke-width="1" stroke-opacity="0.3"/>
  <text x="629" y="488" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FACC15" text-anchor="middle">100%</text>
  <text x="629" y="512" font-family="system-ui, sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">Equipe própria Lexus</text>

  <!-- URL bottom right -->
  <text x="1132" y="590" font-family="system-ui, sans-serif" font-size="16" fill="#A1A1AA" text-anchor="end">lexusautomacao.com</text>

  <!-- Bottom gradient line -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
