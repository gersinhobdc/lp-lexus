<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#16161D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="33%" stop-color="#22C55E"/>
      <stop offset="66%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#22C55E" stroke-width="0.5" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="28" height="8" rx="4" fill="#FACC15"/>
  <rect x="76" y="94" width="30" height="9" rx="4.5" fill="#22C55E"/>
  <rect x="82" y="107" width="30" height="9" rx="4.5" fill="#22C55E"/>
  <rect x="78" y="120" width="28" height="8" rx="4" fill="#EC4899"/>

  <!-- Brand name -->
  <text x="120" y="98" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#E8E8ED" letter-spacing="3">LEXUS</text>
  <text x="120" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#A1A1AA" letter-spacing="4">AUTOMAÇÃO</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#E8E8ED">Sua casa,</text>
  <text x="80" y="360" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="url(#accent)">inteligente.</text>

  <!-- Subtitle -->
  <text x="80" y="420" font-family="system-ui, sans-serif" font-size="22" fill="#A1A1AA">Automação residencial e corporativa premium em São Paulo</text>

  <!-- Stats -->
  <rect x="80" y="480" width="200" height="60" rx="12" fill="#16161D" opacity="0.8"/>
  <text x="180" y="506" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#22C55E" text-anchor="middle">500+</text>
  <text x="180" y="528" font-family="system-ui, sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">Projetos entregues</text>

  <rect x="300" y="480" width="180" height="60" rx="12" fill="#16161D" opacity="0.8"/>
  <text x="390" y="506" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#22C55E" text-anchor="middle">10+</text>
  <text x="390" y="528" font-family="system-ui, sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">Anos de experiência</text>

  <rect x="500" y="480" width="180" height="60" rx="12" fill="#16161D" opacity="0.8"/>
  <text x="590" y="506" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FACC15" text-anchor="middle">4.9★</text>
  <text x="590" y="528" font-family="system-ui, sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">Google Reviews</text>

  <!-- URL -->
  <text x="1120" y="590" font-family="system-ui, sans-serif" font-size="16" fill="#A1A1AA" text-anchor="end">lexusbr.com</text>

  <!-- Bottom gradient line -->
  <rect x="0" y="620" width="1200" height="3" fill="url(#accent)"/>
</svg>
